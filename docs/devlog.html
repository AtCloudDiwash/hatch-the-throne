<script>
const D=JSON.parse(document.getElementById('data').textContent);

 for(const[a,b,k]of E){const p=P.get(a),q=P.get(b);if(!p||!q)continue;const same=p.x===q.x,x1=same?p.x:(p.x<q.x?p.x+p.w:p.x),x2=same?q.x:(p.x<q.x?q.x:q.x+q.w),y1=p.y+9,y2=q.y+9,bend=same?-46:(x2-x1)/2;

 document.querySelectorAll('.nd').forEach(g=>{const act=ev=>{ev.stopPropagation();const id=g.dataset.id;hl=hl===id?null:id;if(byId(id)){sel=id;panel(byId(id))}map()};g.onclick=act;g.onkeydown=ev=>{if(ev.key==='Enter')act(ev)}});
