  const dimmed=con&&!(a===hl||b===hl);s+=`<path class="e e-${k}${dimmed?' dim':''}" d="M${x1} ${y1}C${x1+bend} ${y1} ${x2-bend} ${y2} ${x2} ${y2}"${k==='task'||k==='ref'?'':' marker-end="url(#ar)"'}/>`}
 for(const n of N.values()){const p=P.get(n.id),t=n.label.length>p.w/6?n.label.slice(0,Math.floor(p.w/6))+'…':n.label;s+=`<g class="nd${hl===n.id?' sel':''}${con&&!con.has(n.id)?' dim':''}" data-id="${esc(n.id)}" tabindex=0><title>${esc(n.label)}</title><rect x=${p.x} y=${p.y} width=${p.w} height=18 rx=3 ${n.entry?`style="stroke:${color(byId(n.id).type)}"`:''}/><text x=${p.x+5} y=${p.y+13}>${esc(t)}</text></g>`}
 $('#view').innerHTML=s+`</svg></div><div class=legend><span>Edges:</span>${[['task','entry to task'],['ref','entry to FR, decision or OQ'],['caused','caused by'],['replaces','replaces'],['related','related']].map(([k,l])=>`<span><svg width=36 height=8><path class="e e-${k}" d="M0 4H36"/></svg>${l}</span>`).join('')}</div>`;
 document.querySelectorAll('.nd').forEach(g=>{const act=ev=>{ev.stopPropagation();const id=g.dataset.id;hl=hl===id?null:id;if(byId(id)){sel=id;panel(byId(id))}map()};g.onclick=act;g.onkeydown=ev=>{if(ev.key==='Enter')act(ev)}});
 $('#view svg').onclick=()=>{if(hl){hl=null;map()}}}
function matrix(){const es=visible();let h='<div class=box><table><thead><tr><th>Requirement</th><th>Title</th><th class=n>feature</th><th class=n>change</th><th class=n>fix</th><th class=n>blocked</th><th>Latest entry</th><th>Task status</th></tr></thead><tbody>';
 for(const r of D.requirements){const m=es.filter(e=>e.refs.requirements.includes(r.id)),c=t=>m.filter(e=>e.type===t).length,l=m[m.length-1];const cls=!m.length?'none':(l.type==='blocked'?'blk':'');
  h+=`<tr class="${cls}"><td><code>${r.id}</code></td><td>${esc(r.title)}</td><td class=n>${c('feature')}</td><td class=n>${c('change')}</td><td class=n>${c('fix')}</td><td class=n>${c('blocked')}</td><td>${l?`<a href="#" data-id="${l.id}">${l.id}</a> ${esc(l.type)}`:'no entries'}</td><td>${l?esc(l.task+': '+(D.progress[l.task]||'unknown')):'—'}</td></tr>`}
 $('#view').innerHTML=h+'</tbody></table></div><div class=legend><span><span class=sw style="background:var(--warn);border-radius:2px"></span>no entries yet</span><span><span class=sw style="background:var(--bad);border-radius:2px"></span>latest entry is blocked</span></div>';
 document.querySelectorAll('#view a').forEach(a=>a.onclick=ev=>{ev.preventDefault();sel=a.dataset.id;panel(byId(sel))})}
function render(){({timeline,map,matrix})[view]();document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===view))}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
filters();panel(null);render();
</script></body></html>
